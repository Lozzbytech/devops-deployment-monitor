# ---------------------------------------------------------------------------
# DevOps Deployment Monitor - local development stack
#
#   docker compose up --build
#
# Frontend  -> http://localhost:8080   (Nginx serving the React build)
# Backend   -> http://localhost:5000   (Express REST API)
#
# Values can be overridden from a `.env` file at the project root, e.g.
#   APP_VERSION=1.0.1 BUILD_NUMBER=24 GIT_COMMIT=abc1234 docker compose up --build
# ---------------------------------------------------------------------------
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devops-demo-backend:${APP_VERSION:-1.0.0}
    container_name: devops-monitor-backend
    environment:
      PORT: 5000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_NUMBER: ${BUILD_NUMBER:-1}
      GIT_COMMIT: ${GIT_COMMIT:-local}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
        VITE_BUILD_NUMBER: ${BUILD_NUMBER:-1}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-local}
        VITE_APP_MESSAGE: ${VITE_APP_MESSAGE:-Deployed via Jenkins + Argo CD}
    image: devops-demo-frontend:${APP_VERSION:-1.0.0}
    container_name: devops-monitor-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: devops-monitor-net
